# Publish images to GitHub Container Registry on every push to main.
#
#   ghcr.io/aceteam-ai/citadel-inference-server:base        :base-<sha>
#   ghcr.io/aceteam-ai/citadel-inference-server:tts         :tts-<sha>
#
# `:tts` is the floating tag citadel-cli's embedded omnivoice compose pins
# (the pinned cross-phase contract); `:tts-<sha>` is the immutable one for
# rollback. A floating tag never upgrades in place under `docker compose up
# -d` (citadel-cli #718) -- an upgrade on a node is `compose pull` + restart.
#
# The :tts image is smoke-tested (stub adapter, no GPU, no model) BEFORE it is
# pushed, so a broken build never lands on the floating tag.
#
# Auth uses the built-in GITHUB_TOKEN with packages:write (the org precedent:
# citadel-services' publish-kokoro-image.yml).
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/aceteam-ai/citadel-inference-server

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push :base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/base/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:base
            ${{ env.IMAGE }}:base-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Build :tts (load locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/tts/Dockerfile
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:base-${{ steps.sha.outputs.short }}
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:tts
            ${{ env.IMAGE }}:tts-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=tts
          cache-to: type=gha,mode=max,scope=tts

      - name: Smoke test :tts before publishing
        run: bash scripts/smoke.sh "${IMAGE}:tts-${{ steps.sha.outputs.short }}" 18000

      - name: Push :tts
        run: |
          docker push "${IMAGE}:tts-${{ steps.sha.outputs.short }}"
          docker push "${IMAGE}:tts"
